# dev.antefirma.app: the download page for developers and testers (Workers Static Assets).
# Workers Builds, linked to this repository:
#   build command:   node tools/dev-site-build.mjs
#   deploy command:  npx wrangler deploy --config wrangler.dev.toml
# The extension and AnteFirma web don't use this file: it is only for the "antefirma-dev" Worker.
name = "antefirma-dev"
compatibility_date = "2026-11-01"

routes = [
  { pattern = "dev.antefirma.app", custom_domain = true },
]

[assets]
directory = "./dist/dev-site"
html_handling = "auto-trailing-slash"
