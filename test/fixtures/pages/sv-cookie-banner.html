<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recept – Ljusa köket</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f6f7f9;color:#1b1f24}
header{background:#fff;border-bottom:1px solid #e3e6ea;padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
main{max-width:900px;margin:24px auto;padding:0 16px}
.card{background:#fff;border:1px solid #e3e6ea;border-radius:12px;padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 18px;border-radius:8px;border:1px solid #c9ced6;background:#fff;cursor:pointer;font:inherit;text-decoration:none;color:inherit;margin:4px}
.btn-primary{background:#1b1f24;color:#fff;border-color:#1b1f24}
.price{font-size:28px;font-weight:700}
.small{font-size:13px;color:#5b6470}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.banner{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ccd;padding:16px 24px}
label{display:block;margin:8px 0 4px}
input[type=text],input[type=email],input[type=password]{padding:8px;border:1px solid #c9ced6;border-radius:6px;width:260px}
</style>
</head>
<body>
<header><strong>Ljusa köket</strong><nav><a class=small href="#" style="margin-left:14px">Hjälp</a></nav></header>
<main><div class="card"><h1>Kanelbullar</h1><p>Ingredienser för fyra personer…</p></div></main>
<div class="banner"><p>Vi använder cookies för att mäta trafiken.</p>
 <button class="btn" id="reject">Avvisa alla</button>
 <button class="btn" id="prefs">Hantera inställningar</button>
 <button class="btn btn-primary" id="accept">Acceptera alla</button>
</div>
</body>
</html>
