# Runs on every push and pull request: lint, the English check, unit + golden +
# contract + property tests with coverage thresholds, then the extension and the
# web app in a real Chromium (with axe-core accessibility checks).
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:english
      - run: npm run test:coverage
      - name: Web app build
        run: node tools/web-build.mjs
      - name: Install Chromium for the end-to-end check
        run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: Which buttons are held, on 30 realistic pages
        run: node --test test/detector.test.mjs
      - name: Extension end-to-end check
        run: xvfb-run -a npm run test:e2e
      - name: End-to-end scenarios (demo pages, server failures, tokens, plans, SPA, iframe, decisions, synthetic clicks)
        timeout-minutes: 5
        run: xvfb-run -a node test/e2e/all.mjs
      - name: Web app in a real browser (first visit, consent, verdict, accessibility, phone)
        run: node test/web.mjs
      - name: Visual regression of the web app screens (same CSS as the extension)
        run: node test/visual.mjs
      - name: Keep the new screenshots and diffs when the visual check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: test/visual/*.png
          if-no-files-found: ignore
